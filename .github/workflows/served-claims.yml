name: Served claims — PROD scan

# Reglas 3 y 4 de `scripts/check-tells.sh` (precios inventados y «reemplaza N
# herramientas») sobre lo que PRODUCCIÓN sirve, en cada sitio publicado e
# indexable que lista el API (`GET /api/v1/sites/published-hosts`). Issue #101.
#
# NO es un check de PR, a propósito: mide datos vivos que el PR no cambia. Un
# precio publicado por un inquilino no puede poner en rojo un PR ajeno. Corre:
#   - una vez por día (schedule);
#   - después de cada deploy de producción: `prod.yml` lo llama como último
#     paso (`workflow_call`) sólo si el deploy terminó bien;
#   - a mano (workflow_dispatch).
#
# Una lista vacía o corta es ROJO, no verde: el spec exige al menos
# `SERVED_CLAIMS_MIN_HOSTS` hosts y que esté el sitio de referencia.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Rules 3-4 over production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # `--ignore-scripts`: el scan no construye nada ni abre un navegador, así
      # que ningún script de instalación hace falta.
      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Escanear producción
        shell: bash
        env:
          SERVED_CLAIMS_TARGET: prod
          SERVED_CLAIMS_MIN_HOSTS: "2"
          SITE_API_BASE_URL: https://api.1platform.pro
        run: |
          set -euo pipefail
          ./node_modules/.bin/playwright test -c playwright.served-claims.config.ts
