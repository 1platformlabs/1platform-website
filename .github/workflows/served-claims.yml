name: Served claims — PROD scan

# Reglas 3 y 4 de `scripts/check-tells.sh` (precios inventados y «reemplaza N
# herramientas») sobre lo que PRODUCCIÓN sirve, en TODOS los sitios publicados e
# indexables que lista el API (`GET /api/v1/sites/published-hosts`). Issue #101.
#
# NO es un check de PR, a propósito: mide datos vivos que el PR no cambia. Un
# precio publicado por un inquilino no puede poner en rojo un PR ajeno. Corre:
#   - una vez por día;
#   - después de cada deploy de producción que terminó bien;
#   - a mano (workflow_dispatch).
#
# Una lista vacía o corta es ROJO, no verde: el spec exige al menos
# `SERVED_CLAIMS_MIN_HOSTS` hosts y que esté el sitio de referencia.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_run:
    workflows: ["1Platform Website — PROD"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: served-claims-prod
  cancel-in-progress: false

jobs:
  scan:
    name: Rules 3-4 over production
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          # En `workflow_run` el checkout por defecto es la rama por defecto,
          # que es lo que se desplegó; se deja explícito.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      # Sin navegador: el spec pide HTML con `fetch`, no dibuja nada.
      - name: Escanear producción
        shell: bash
        env:
          SERVED_CLAIMS_TARGET: prod
          SERVED_CLAIMS_MIN_HOSTS: "2"
          SITE_API_BASE_URL: https://api.1platform.pro
        run: |
          set -euo pipefail
          npx playwright test -c playwright.served-claims.config.ts
