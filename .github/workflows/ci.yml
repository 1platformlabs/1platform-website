name: CI — Pull Request

# The repository's five real gates, running BEFORE merge.
#
# Hasta que existió este archivo no corría ninguna: `prod.yml` dispara sólo en
# `push: [main]` y su job de build ejecuta `astro build` y nada más. O sea que
# un PR que rompía el guard de proveedores —el que enforcea la regla crítica
# del ecosistema, cero nombres de proveedor en superficie de cliente— mergeaba
# y desplegaba en verde, y lo mismo un error de tipos, porque `astro build` no
# typechequea.
#
# Deliberadamente NO se le agrega un trigger `pull_request` a `prod.yml`: ese
# workflow es la tubería de despliegue y darle ese disparador arrastraría el
# environment de PROD y sus credenciales a cada pull request.
#
# Molde: el repo hermano `1platform-api-developer` (`.github/workflows/ci.yml`).
on:
  # Stacked PRs are first-class in this repo. Restricting this workflow to
  # `main` leaves a PR against its feature dependency with no checks at all.
  pull_request:

# Ningún job necesita escribir nada.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, guard de diseño y build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      # `astro build` transpila sin typechequear, así que un error de tipos
      # llegaba a producción compilando en verde.
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      # El build va ANTES del guard a propósito: dos de sus reglas —el
      # presupuesto de 64 KB de JS público y el «motion CSS-first»— miden lo que
      # el build emite, y sin él el guard aborta diciendo que no encuentra el
      # directorio de assets (medido: `npm run check` sobre un árbol limpio sale
      # 1 por eso solo).
      #
      # Con el adapter de Node ese directorio pasó a ser `dist/client/_astro`.
      # La regla resuelve las dos ubicaciones, así que sigue midiendo lo mismo;
      # lo que NO cambió, y es lo que importa, es que ante un árbol sin construir
      # falla en vez de contar cero y llamarlo pase.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      # `npm run check` es `check-tells.sh && check-tells-self-test.sh`: el
      # guard y la prueba de que el guard todavía FALLA ante cada tell. Un
      # guard sólo es evidencia si se lo vio fallar.
      - name: Guard de sistema de diseño y proveedores (con su self-test)
        shell: bash
        run: |
          set -euo pipefail
          npm run check

  browser:
    name: Suite de navegador
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      # Sólo chromium: es el único proyecto declarado en playwright.config.ts.
      - name: Instalar navegador
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      # El `webServer` del config corre `npm run build && node
      # dist/server/entry.mjs`, así que esta suite mide el SERVIDOR real, que es
      # el artefacto que corre en producción detrás de nginx. Antes medía el
      # `dist/` estático que se rsynceaba; con el adapter esa frase dejó de ser
      # cierta, y la suite se reescribió para seguir al sujeto en vez de
      # ablandarse. Mide más que antes: los 301, el 404 y el endpoint de
      # imágenes los contesta ahora el mismo código que producción.
      # La línea base visual queda fuera a propósito (`testIgnore`): compara
      # renders de Linux por contenedor y es su propio comando (job `visual`).
      - name: Tests de navegador
        shell: bash
        run: |
          set -euo pipefail
          npm test

  visual:
    name: Regresión visual SSR multitenant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      # The npm script owns the exact browser image used to write the committed
      # Linux baselines. Running that same image here avoids approving a render
      # merely because the runner image changed its fonts or text shaper.
      - name: Comparar capturas Linux contra la línea base
        shell: bash
        run: |
          set -euo pipefail
          npm run test:visual

  baseline:
    name: No-regresión byte a byte
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # ⚠️ NO BLOQUEANTE A PROPÓSITO (issue #99 la cablea; no le pide bloquear).
    # Documentado en epics/website-multitenant/PROGRESO-website-multitenant.md
    # §3: HOY el comparador da 51 idénticas / 2 con diferencia (atribuidas al
    # endpoint de imágenes) / 47 redirecciones-o-404 — rutas que F4b/F6/F7
    # renombraron DESPUÉS de que F0 congelara tests/baseline/baseline.json, que
    # nunca se re-congeló. El script no distingue "una ruta retirada sigue
    # redirigiendo, a propósito" de "una ruta que se rompió": enseñarle esa
    # distinción es una decisión de diseño (qué redirecciones son legítimas)
    # que el alcance de #99 no pidió y que compare-served.mjs evita a propósito
    # en el resto de sus reglas ("normalisation is EARNED, never assumed").
    # Sin esta salvedad este job estaría SIEMPRE en rojo por causas ya
    # conocidas, no por lo que cambie cada PR — entrenaría a ignorarlo, que es
    # exactamente lo que un gate no debe hacer. `continue-on-error` lo deja
    # correr y ser VISIBLE (el número, en el log, en cada PR) sin bloquear el
    # merge por un gap preexistente. Medido en esta misma corrida: sabotear
    # BaseLayout.astro (una plantilla compartida) mueve «differing» de 2 a 52
    # — el gate SÍ discrimina un regresión nueva; sólo no exige partir de cero.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5
        with:
          # scripts/check-no-regression.sh necesita historia completa: ubica el
          # commit del que se congeló tests/baseline/baseline.json (su propio
          # padre) y lo construye en un worktree separado para conseguir los
          # bodies estáticos que el comparador exige.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      # `check-no-regression.sh` build dos veces (el árbol actual y el de la
      # línea base) y sirve el actual en modo `repo`, que es el único que este
      # job puede servir sin una API. Ver scripts/compare-served.mjs para por
      # qué `--bodies` no es opcional.
      - name: No-regresión byte a byte de 1platform.pro
        shell: bash
        run: |
          set -euo pipefail
          npm run check:baseline -- --explain
