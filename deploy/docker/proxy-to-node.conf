# Cómo se le habla al proceso de Astro. Se incluye desde CADA `location` de
# `nginx.conf`, y esa repetición es obligatoria: `proxy_pass` no se hereda de un
# bloque padre, así que un `location` que se olvide de incluir esto no hace de
# proxy — cae al `root`, que en esta imagen no existe, y devuelve 404 con el
# contenedor sano y el sitio roto.
#
# ── LA LÍNEA QUE SOSTIENE TODA LA ÉPICA ──────────────────────────────────────
# `proxy_set_header Host $host;`
#
# Sin ella nginx manda `Host: $proxy_host` — la dirección del upstream,
# `127.0.0.1:4321` — porque ése es el DEFAULT de nginx, no un descuido. Y en
# este servidor el `Host` no es un detalle de transporte: es lo que ELIGE AL
# INQUILINO. Con el default, todas las peticiones de todos los dominios
# llegarían a Astro con el mismo Host, `resolveTenant()` no encontraría ninguno,
# y el sitio entero —para todos los clientes a la vez— contestaría 404.
#
# Copiado verbatim del molde que este ecosistema ya usa para lo mismo:
# `1platform-api/scripts/edge/vhost-upsert:103-111`.
proxy_pass http://127.0.0.1:4321;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# El esquema que vio el VISITANTE, no el que ve este origen. La zona de
# Cloudflare está en `flexible`, así que el borde habla HTTP plano acá y
# `$scheme` siempre vale `http`. `X-Forwarded-Proto` es la única forma de que la
# aplicación sepa que el visitante llegó por https.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# Un render depende ahora de una llamada a `1platform-api` con timeout propio de
# 3 s, más la plantilla. 30 s es holgado para eso y corto para que una petición
# colgada no ocupe un worker indefinidamente.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# El 404 y el 503 de la aplicación son RESPUESTAS, no fallas del proxy: el 404
# es la página de error del inquilino y el 503 es el `Retry-After` honesto de
# D-22. Con `proxy_intercept_errors on` nginx se los comería y serviría su
# propia página de error genérica, que no lleva ni el cromo ni la marca del
# inquilino. Está `off` por defecto; se escribe igual para que quede dicho.
proxy_intercept_errors off;
