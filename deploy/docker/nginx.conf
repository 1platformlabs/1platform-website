# 1platform.pro — contrato de servido, traducido regla por regla desde
# `deploy/cpanel/htaccess/landing.htaccess`.
#
# Este archivo NO es una reescritura libre: cada bloque cita la directiva Apache
# que reemplaza. Si el .htaccess cambia, este archivo cambia con él — son el
# mismo contrato expresado para dos servidores distintos, y el de cPanel sigue
# publicándose (su canal está gateado, no borrado).
#
# ══════════════════════════════════════════════════════════════════════════════
# QUÉ CAMBIÓ EN F5, Y QUÉ SE CONSERVA
# ══════════════════════════════════════════════════════════════════════════════
# nginx deja de servir archivos y pasa a hacer de proxy a Node (D-23). Lo que NO
# cambia es de quién es el contrato: las cabeceras, la política de caché por
# familia de archivo y el `nosniff` los sigue poniendo nginx. Lo que cambia es
# que abajo hay una aplicación en vez de un directorio.
#
# ── Un solo `server`, y acepta CUALQUIER Host ────────────────────────────────
# El `default_server` que devolvía `444` y el bloque con
# `server_name 1platform.pro www.1platform.pro` DESAPARECEN, y no es un descuido:
# con N marcas servidas por un solo contenedor, dar de alta un inquilino no
# puede significar editar este archivo y redesplegar — que es exactamente lo que
# la épica existe para evitar (D-2, decisión del usuario: «un solo server o
# container, así como funciona Atlas»).
#
# El costo está nombrado: el `444` ya no puede discriminar, porque este archivo
# no sabe qué hosts son válidos sin preguntarle a la API. El desenlace correcto
# pasa a ser un **404 real**, y lo da la aplicación — que sí sabe (D-24). Eso es
# mejor señal que cortar la conexión, y viene con su propia defensa: caché
# negativa de hosts no resueltos y un presupuesto de fallos de caché por minuto,
# para que un diluvio de hosts inventados no se convierta en un ataque de
# amplificación contra `1platform-api` desde el propio sitio.
#
# La defensa en profundidad que el `444` daba NO se pierde del todo: el front
# door sigue enrutando por Host y el firewall del dedicado sólo le abre el 3040
# a él (`DOCKER-USER`, ver `docker-compose.prod.yml`).
#
# ── REGLA DURA, heredada del .htaccess ───────────────────────────────────────
# Nada acá puede forzar HTTPS **sobre el mismo host**. La zona de Cloudflare está
# en `flexible`: el borde habla HTTP plano con este origen, así que un redirect
# https del mismo host no termina nunca — el navegador vuelve al borde por HTTPS,
# el borde sigue hablando HTTP con el origen, la petición es indistinguible de la
# primera y la misma regla dispara otra vez. Es un loop infinito, no un
# endurecimiento. Cambiar de HOST sí está permitido (ver www → apex abajo).

# ── El Cache-Control de una PÁGINA: el del contrato, salvo que la aplicación
# ── haya dicho otra cosa a propósito ────────────────────────────────────────
# Las familias de estáticos de abajo REEMPLAZAN lo que mande el upstream: ahí el
# contrato manda y Astro no tiene opinión que respetar. Las páginas no son ese
# caso. El `503` de D-22 sale con `no-store` DELIBERADO —una respuesta de «la
# API no contesta, volvé en 30 s» no se cachea ni un segundo— y un
# `proxy_hide_header` a secas lo convertiría en `max-age=0, must-revalidate`,
# que autoriza a guardarla.
#
# El `map` resuelve las dos mitades sin elegir una: si el upstream no mandó
# nada, se pone el valor del contrato; si mandó algo, se respeta. Y como el
# `add_header` va junto a un `proxy_hide_header`, sale EXACTAMENTE UNA cabecera
# en los dos casos — que es lo que este bloque existe para garantizar.
map $upstream_http_cache_control $page_cache_control {
    ''      "public, max-age=0, must-revalidate";
    default $upstream_http_cache_control;
}

server {
    listen 80 default_server;

    # `_` no matchea ningún host: es el nombre convencional para «este bloque no
    # compite por nombre». Como es el único `server` y es `default_server`, le
    # llega todo — que es el punto. Quién es el inquilino lo decide la
    # aplicación, leyendo el `Host` que `proxy-to-node.conf` le reenvía.
    server_name _;

    # Sin `root` y sin `index`: no queda un solo archivo que servir desde disco.
    # `dist/client` lo sirve el propio adapter de Astro, que le pone a `/_astro/`
    # su cabecera inmutable (medido) y conoce el `trailingSlash` del build.
    autoindex off;

    # Los redirects que emite NGINX salen relativos. Con `on` (el default) nginx
    # construye `http://$host/...` y, detrás de Cloudflare flexible, eso degrada
    # al navegador a http para que el borde lo vuelva a subir: un salto extra y
    # una ventana en claro. Se conserva aunque hoy sólo gobierne el redirect de
    # `www` de abajo — los de `trailingSlash` los emite Node, y ya salen
    # relativos (medido: `GET /pricing` -> `301` con `Location: /pricing/`).
    absolute_redirect off;

    server_tokens off;

    # Apache: `AddOutputFilterByType DEFLATE ...` (mod_deflate)
    #
    # ⚠️ `application/xml` y `application/rss+xml` son NUEVOS y no son cosmética.
    # Antes nginx tipaba los archivos por su extensión y `text/xml` alcanzaba;
    # ahora el tipo lo pone el upstream, y está MEDIDO que Astro emite
    # `application/xml` para el sitemap y para los feeds. Sin estas dos líneas
    # los cuatro feeds y los dos sitemaps dejarían de comprimirse en silencio.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        application/xml
        application/rss+xml
        application/javascript
        application/json
        image/svg+xml;

    # Un manifiesto y una copia por petición pueden pesar; el default de 4k/8k
    # deja a nginx bufferear a disco en cada render.
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;

    # ── Canonical host: www → apex, 301 ─────────────────────────────────────
    # Apache: `RewriteCond %{HTTP_HOST} ^www\.(.+)$` + `RewriteRule ^ https://%1%{REQUEST_URI}`
    #
    # Esto NO viola la regla dura de arriba: cambia el HOST, así que la petición
    # redirigida deja de matchear la condición que la produjo y se sirve.
    #
    # Es GENÉRICO por construcción —`^www\.(.+)$` sobre `$host`— así que sirve a
    # cualquier inquilino sin nombrarlo. Consecuencia que conviene decir en voz
    # alta: un `www.` que un manifiesto declare como `host_aliases` nunca llega a
    # la aplicación desde este contenedor, porque nginx lo redirige antes. Las
    # dos capas coinciden en la política (el apex es el canónico) y el alias en
    # el manifiesto sigue siendo necesario para el resolver, que también contesta
    # a llamadas que no pasan por acá.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # ── Cabeceras de seguridad y caché ──────────────────────────────────────
    # Apache: `Header set X-Content-Type-Options "nosniff"` con `<FilesMatch "^.*$">`
    #
    # ⚠️ TRAMPA DE NGINX, y el motivo de que `nosniff` se repita en CADA location
    # de abajo: `add_header` NO se hereda de forma acumulativa — un `add_header`
    # en un bloque hijo DESCARTA todos los del padre. Sin repetirlo, `/_astro/`,
    # las fuentes y el sitemap saldrían sin `nosniff` mientras `/` sí lo lleva, y
    # un gate que sólo mire `/` lo daría por bueno.
    add_header X-Content-Type-Options "nosniff" always;

    # ⚠️ SEGUNDA TRAMPA, y ésta es NUEVA con el proxy: `add_header` SUMA a lo que
    # ya mandó el upstream, no reemplaza. Astro pone su propio `Cache-Control` en
    # los estáticos (medido: `/_astro/*` sale con `max-age=31536000, immutable`,
    # `/favicon.svg` con `max-age=0`), así que sin `proxy_hide_header` el cliente
    # recibiría DOS cabeceras `Cache-Control` con valores distintos y el
    # resultado lo decide cada caché intermedia. Por eso cada bloque que fija
    # caché esconde primero la del upstream.
    #
    # Lo mismo vale para `nosniff`, y esto SE MIDIÓ contra el contenedor real:
    # las rutas que la aplicación sirve con su propia cabecera de seguridad
    # —`robots.txt`, el 404, el 503 de D-22— salían con `X-Content-Type-Options`
    # DUPLICADA. Mismo valor, así que ningún navegador se confunde; pero el
    # contrato dice que estas cabeceras las pone nginx, y una comprobación que
    # cuente ocurrencias tenía razón en ponerse roja. `proxy_hide_header` deja
    # una sola, la de acá, y la de la aplicación sigue existiendo para el caso
    # en que alguien alcance a Node sin pasar por este proxy.

    # Apache: `<FilesMatch "\.(html|xml|txt|json)$">` → `max-age=0, must-revalidate`
    # Sin esto Cloudflare congela el sitemap por extensión y un deploy se vuelve
    # invisible para los buscadores.
    #
    # ⚠️ Este bloque es una REGEX, así que nginx lo evalúa ANTES que el prefijo
    # `/` — y desde F4 `robots.txt`, `sitemap-0.xml` y `sitemap-index.xml` son
    # RUTAS RENDERIZADAS, no archivos. Sin su propio `include` acá, las tres
    # dejarían de llegar a Node y contestarían 404 con el resto del sitio sano.
    location ~* \.(html|xml|txt|json)$ {
        include /etc/nginx/proxy-to-node.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Apache: `SetEnvIf Request_URI "^/_astro/" IMMUTABLE_ASSET=1` → immutable 1 año
    # Astro emite estos assets con hash de contenido: el nombre cambia cuando
    # cambian los bytes, así que una caché inmutable nunca puede servir uno viejo.
    # `^~` para que gane sobre las regex de arriba y de abajo.
    location ^~ /_astro/ {
        include /etc/nginx/proxy-to-node.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Apache: `<FilesMatch "\.(woff2|ico|png|jpg|jpeg|webp|avif|svg)$">` →
    #         `Header setifempty Cache-Control "public, max-age=86400"`
    # Estáticos SIN fingerprint (viven en public/): su nombre es estable, así que
    # un año inmutable dejaría un fix varado en navegadores que no podemos purgar.
    # Un día, revalidado, es el techo honesto. Astro los sirve con `max-age=0`
    # (medido sobre `/favicon.svg`), así que acá el `proxy_hide_header` no es
    # defensivo: sin él el contrato NO se cumple.
    location ~* \.(woff2|ico|png|jpg|jpeg|webp|avif|svg)$ {
        include /etc/nginx/proxy-to-node.conf;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Todo lo demás: las páginas ──────────────────────────────────────────
    # Apache: `DirectorySlash On`. El build usa `trailingSlash:'always'`, así que
    # `/pricing` DEBE responder 301 → `/pricing/`: las URLs canónicas, el sitemap
    # y cada enlace indexado dependen de ese redirect.
    #
    # ⚠️ La regla vieja era `if (-d $request_filename)`, una prueba de SISTEMA DE
    # ARCHIVOS. Bajo SSR no hay un directorio por página, así que esa condición
    # sería siempre falsa — y falsa EN SILENCIO, sin error, con `/pricing`
    # pasando tal cual al upstream. No se reescribe: se COMPRUEBA que el adapter
    # ya la cumple, y está medido contra el servidor real —
    #     GET /pricing  ->  301  Location: /pricing/
    # — que es lo que emite `@astrojs/node` cuando el build declara
    # `trailingSlash: 'always'` (`serve-static.js`). El test que discrimina
    # sondea la ruta SIN barra; sondear `/pricing/` pasa en verde con el defecto
    # puesto.
    location / {
        include /etc/nginx/proxy-to-node.conf;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $page_cache_control always;
    }

    # ── ErrorDocument 404 ───────────────────────────────────────────────────
    # El `error_page 404 /404.html` y su `location = /404.html { internal; }`
    # DESAPARECEN, y hay que decir por qué para que nadie los reponga: el 404 lo
    # rendersiza ahora la aplicación, con el cromo y la marca DEL INQUILINO que
    # lo pidió. Un `error_page` acá lo reemplazaría por la página genérica de
    # nginx — sin marca, igual para todos, y por lo tanto una fuga al revés.
    # `proxy_intercept_errors off` (en `proxy-to-node.conf`) es lo que garantiza
    # que el 404 del upstream llegue intacto.
    #
    # Sigue siendo un 404 REAL: deliberadamente sin fallback tipo SPA, porque un
    # fallback convertiría cada URL muerta en un 200 blando y envenenaría el
    # índice de todos los inquilinos a la vez.
}
