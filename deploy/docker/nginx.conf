# 1platform.pro — contrato de servido, traducido regla por regla desde
# `deploy/cpanel/htaccess/landing.htaccess`.
#
# Este archivo NO es una reescritura libre: cada bloque cita la directiva Apache
# que reemplaza. Si el .htaccess cambia, este archivo cambia con él — son el
# mismo contrato expresado para dos servidores distintos, y el de cPanel sigue
# publicándose (su canal está gateado, no borrado).
#
# ── REGLA DURA, heredada del .htaccess ───────────────────────────────────────
# Nada acá puede forzar HTTPS **sobre el mismo host**. La zona de Cloudflare está
# en `flexible`: el borde habla HTTP plano con este origen, así que un redirect
# https del mismo host no termina nunca — el navegador vuelve al borde por HTTPS,
# el borde sigue hablando HTTP con el origen, la petición es indistinguible de la
# primera y la misma regla dispara otra vez. Es un loop infinito, no un
# endurecimiento. Cambiar de HOST sí está permitido (ver www → apex abajo).

# ── Catch-all: un Host que no es nuestro no recibe nada ──────────────────────
# MEDIDO al construir esta imagen: con un único `server{}`, declarar
# `server_name 1platform.pro www.1platform.pro` NO discrimina — nginx toma el
# primer bloque como default y un Host inventado recibía la landing con el
# cuerpo IDÉNTICO (63.119 bytes). `server_name` sólo elige entre bloques que
# compiten; por sí solo no rechaza nada.
#
# `444` cierra la conexión sin responder. Es defensa en profundidad: el front
# door ya enruta por Host y el firewall del dedicado sólo le abre el 3040 a él,
# pero si alguna de esas dos capas se afloja, este contenedor no sirve la
# landing bajo un hostname ajeno.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name 1platform.pro www.1platform.pro;

    root /usr/share/nginx/html;

    # Apache: `DirectoryIndex index.html`
    index index.html;

    # Apache: `Options -Indexes`
    autoindex off;

    # Los redirects que emite nginx salen RELATIVOS. Con `on` (el default)
    # nginx construye `http://$host/...` y, detrás de Cloudflare flexible, eso
    # degrada al navegador a http para que el borde lo vuelva a subir: un salto
    # extra y una ventana en claro, por cada `/pricing` sin barra. Relativo
    # conserva el esquema que el navegador ya tenía.
    absolute_redirect off;

    # No publicar la versión del servidor en cabeceras ni en páginas de error.
    server_tokens off;

    # Apache: `AddOutputFilterByType DEFLATE ...` (mod_deflate)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        image/svg+xml;

    # ── Canonical host: www → apex, 301 ─────────────────────────────────────
    # Apache: `RewriteCond %{HTTP_HOST} ^www\.(.+)$` + `RewriteRule ^ https://%1%{REQUEST_URI}`
    #
    # Esto NO viola la regla dura de arriba: cambia el HOST, así que la petición
    # redirigida deja de matchear la condición que la produjo y se sirve. El
    # `https://` explícito es correcto y necesario acá — es un destino absoluto
    # con otro host, no un upgrade de esquema del mismo host.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # ── Cabeceras de seguridad y caché ──────────────────────────────────────
    # Apache: `Header set X-Content-Type-Options "nosniff"` con `<FilesMatch "^.*$">`
    #
    # ⚠️ TRAMPA DE NGINX, y el motivo de que `nosniff` se repita en CADA location
    # de abajo: `add_header` NO se hereda de forma acumulativa — un `add_header`
    # en un bloque hijo DESCARTA todos los del padre. Sin repetirlo, `/_astro/`,
    # las fuentes y el sitemap saldrían sin `nosniff` mientras `/` sí lo lleva, y
    # un gate que sólo mire `/` lo daría por bueno. T-29 sondea las cuatro
    # familias justamente por eso.
    add_header X-Content-Type-Options "nosniff" always;

    # Apache: `<FilesMatch "\.(html|xml|txt|json)$">` → `max-age=0, must-revalidate`
    # Sin esto Cloudflare congela el sitemap por extensión y un deploy se vuelve
    # invisible para los buscadores.
    location ~* \.(html|xml|txt|json)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Apache: `SetEnvIf Request_URI "^/_astro/" IMMUTABLE_ASSET=1` → immutable 1 año
    # Astro emite estos assets con hash de contenido: el nombre cambia cuando
    # cambian los bytes, así que una caché inmutable nunca puede servir uno viejo.
    # `^~` para que gane sobre las regex de arriba y de abajo.
    location ^~ /_astro/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Apache: `<FilesMatch "\.(woff2|ico|png|jpg|jpeg|webp|avif|svg)$">` →
    #         `Header setifempty Cache-Control "public, max-age=86400"`
    # Estáticos SIN fingerprint (viven en public/): su nombre es estable, así que
    # un año inmutable dejaría un fix varado en navegadores que no podemos purgar.
    # Un día, revalidado, es el techo honesto.
    location ~* \.(woff2|ico|png|jpg|jpeg|webp|avif|svg)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── DirectorySlash On ───────────────────────────────────────────────────
    # Apache: `DirectorySlash On`. Astro construye con `trailingSlash:'always'`,
    # así que `/pricing` DEBE responder 301 → `/pricing/`: las URLs canónicas, el
    # sitemap y cada enlace indexado dependen de ese redirect.
    #
    # ⚠️ Por qué no alcanza `try_files $uri $uri/ =404`: con `$uri/` nginx
    # resuelve el directorio por redirección INTERNA y devuelve **200** sin
    # mandar `Location`. El navegador se queda en `/pricing`, el canonical no
    # coincide, y un test que sondee sólo `/pricing/` (el lado que no falla)
    # pasa en verde. Por eso el `-d` explícito va ANTES del try_files, y T-5b
    # sondea la ruta SIN barra.
    location / {
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # ── ErrorDocument 404 /404.html ─────────────────────────────────────────
    # Un 404 es un 404 REAL. Deliberadamente sin fallback tipo SPA: un fallback
    # convertiría cada URL muerta en un 200 blando y envenenaría el índice.
    # `internal` evita que /404.html sea alcanzable como ruta propia con 200.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # El health check del pipeline sondea `/` por 127.0.0.1; no hace falta un
    # endpoint aparte y agregarlo sería superficie que el contrato no pide.
}
