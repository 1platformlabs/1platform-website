sonar.projectKey=1platformlabs_1platform-website
sonar.organization=1platformlabs

# SOLO PULL REQUESTS. Lo analiza el job `sonarcloud` de `.github/workflows/ci.yml`,
# que corre unicamente en `pull_request` (epica `sonar-solo-en-pr`).
#
# El costo de SonarCloud depende de QUE se analiza: el `nclocCount` que factura la
# organizacion es exactamente la suma del `ncloc` de las ramas `main` de los
# proyectos, y un proyecto con PRs analizados y `main` sin analizar aporta 0
# (medido: `1platform-api`, `bower-dashboard`, `1platform-atlas-app`). Por eso no
# hay analisis de `main`, y no hay que agregarlo. La contra queda dicha: se ve solo
# lo que cada PR toca, nunca el codigo existente.
#
# La sola existencia de este archivo apaga el Analisis Automatico del proyecto.

# El codigo del sitio. `public/` son fuentes, imagenes OG y el favicon; `deploy/`
# son scripts de shell y configuracion de nginx, que el escaner no juzga.
# `.github` entra a proposito: los hallazgos sobre los workflows valen tenerlos.
sonar.sources=src,scripts,astro.config.mjs,.github

# Los tests viven en `tests/` (specs de Playwright y sus helpers). Declararlos no
# consume cuota: un archivo de test cuenta 0 lineas de codigo.
sonar.tests=tests

# SIN COBERTURA, a proposito. La suite es de navegador y no emite reporte. Sin esta
# linea el gate mediria 0 % sobre el codigo nuevo y fallaria por falta de datos y
# no por calidad — el modo de fallo que termina con alguien apagando el gate.
sonar.coverage.exclusions=**

sonar.sourceEncoding=UTF-8
