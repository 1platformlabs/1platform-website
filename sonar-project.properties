sonar.projectKey=1platformlabs_1platform-website
sonar.organization=1platformlabs

# ⚠️ ESTE archivo define el alcance del análisis, y su sola existencia apaga el
# Análisis Automático de SonarCloud (que lee `.sonarcloud.properties`, no éste).
# Acá no hay ninguno de los dos hasta ahora: medido el 2026-09-04 contra
# `api/projects/search?organization=1platformlabs`, la organización tiene 14
# proyectos y NINGUNO es `1platformlabs_1platform-website`. O sea que este
# repositorio no lo analizaba nadie, ni por CLI ni por autoscan, y el primer
# análisis del job `SonarCloud Code Analysis` va a crear el proyecto.
#
# ALCANCE Y CUOTA. La organización consumía 250.294 ncloc de un techo de 300.000
# el 2026-09-04: quedan ~49.700 líneas y el margen no sobra. Sin acotar, el
# análisis mandaría como código de producción los 30.109 renglones de `tests/`,
# los binarios de `src/assets/` y el contenido editorial de `src/content/`; con
# el techo tocado, TODOS los análisis de TODOS los repos rebotan con "This
# analysis will make your organization reach the maximum allowed lines limit".
#
# El job dispara SÓLO en `pull_request`, y eso también importa para la cuota:
# los análisis de PR no acumulan ncloc en la organización, los de la rama
# principal sí (medido en `1platform-atlas-app` contra `api/billing/show`). La
# contra queda dicha: se ve sólo lo que cada PR toca, nunca el código existente.

# `src` es Astro (87 archivos, 11.039 líneas) + TypeScript (42 archivos, 4.210).
# SonarCloud no tiene analizador de `.astro`, así que ese grueso no produce
# ncloc ni hallazgos: lo que este proyecto mide de verdad son los `.ts` de
# `src/i18n`, `src/scripts` y `src/page-content`, los `.css` de `src/styles` y
# los `.mjs`/`.py` de `scripts/`.
sonar.sources=src,scripts

# Los specs de Playwright (21 archivos `.ts`, 2.128 líneas). Declararlos NO
# consume cuota —un archivo de test cuenta 0 líneas de código, verificado en
# `bower-api`: 300 archivos indexados, 0 ncloc— y a cambio habilitan las reglas
# que sólo corren sobre tests ("agregá al menos una aserción", "reemplazá estos
# 3 tests por uno parametrizado").
#
# NO se agrega `sonar.test.exclusions=tests/**`: ese par declara el conjunto de
# tests y lo VACÍA en la línea siguiente. Medido en `1platform-atlas-api`, que
# tenía exactamente esa combinación: CERO archivos de test indexados.
sonar.tests=tests

# Fuera del análisis:
#   src/assets/**   imágenes del producto (78 .webp + 5 .png) y sus manifiestos
#   src/content/**  el blog en Markdown — prosa, no código
#   public/**       estático servido tal cual, incluidas 36 imágenes
#   dist/**         salida de `astro build`
#   deploy/**       shell de despliegue a cPanel; Sonar no analiza `.sh`
sonar.exclusions=**/node_modules/**,dist/**,src/assets/**,src/content/**,public/**,deploy/**,**/*.png,**/*.webp,**/*.woff2

# COBERTURA: NO SE MIDE, y es un hueco conocido, no un olvido. `npm test` es
# Playwright contra el `dist/` construido —suite de navegador, no de unidad— y
# no emite lcov; el repo no tiene runner de tests unitarios.
#
# Se excluye todo de cobertura A PROPÓSITO: sin reporte, el gate mediría 0 % de
# cobertura en código nuevo y fallaría por FALTA DE DATOS y no por calidad —que
# es el modo de fallo que termina con alguien apagando el gate—. Con esta línea
# el gate evalúa las otras condiciones (fiabilidad, seguridad, mantenibilidad,
# duplicación, hotspots), que es donde está el grueso del valor.
#
# Para cerrarlo: publicar un `coverage/lcov.info`, declarar
# `sonar.javascript.lcov.reportPaths` y borrar esta línea.
sonar.coverage.exclusions=**

sonar.sourceEncoding=UTF-8
